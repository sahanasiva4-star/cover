<!DOCTYPE html>
<html>
<head>
    <title>Book Cover</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .cover {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #e60000, #ff4d4d);
            color: white;
            position: relative;
            padding: 40px;
            box-sizing: border-box;
        }

        .top-text {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .line {
            width: 120px;
            height: 2px;
            background-color: white;
            margin-top: 8px;
        }

        .title {
            margin-top: 60px;
            font-size: 42px;
            font-weight: bold;
            line-height: 1.3;
        }

        .subtitle {
            margin-top: 20px;
            font-size: 18px;
        }

        .photo {
            position: absolute;
            bottom: 120px;
            right: 50px;
            background-color: white;
            padding: 8px;
        }

        .photo img {
            width: 140px;
            height: 170px;
        }

        .bottom {
            position: absolute;
            bottom: 40px;
            width: calc(100% - 80px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .edition {
            font-weight: bold;
        }

        .footer-line {
            position: absolute;
            bottom: 80px;
            width: calc(100% - 80px);
            height: 2px;
            background-color: white;
        }
    </style>

</head>
<body>

<div class="cover">

    <div class="top-text">SEC INSIGHT</div>
    <div class="line"></div>

    <div class="title">
        Web Development:<br>
        The Complete<br>
        Reference
    </div>

    <div class="subtitle">
        with Django and Bootstrap Insights
    </div>

    <div class="photo">
        <img src="MyPhoto.jpg" alt="Author Photo">
    </div>

    <div class="footer-line"></div>

    <div class="bottom">
        <div>
            <div class="edition">Extended Edition</div>
            <div>Sahana S</div>
        </div>
        <div>SEC</div>
    </div>

</div>

</body>
</html>
